/**:
  ros__parameters:

    planner_configs:

      SBLkConfigDefault:
        type: geometric::SBL

      ESTkConfigDefault:
        type: geometric::EST
        goal_bias: 0.05

      LBKPIECEkConfigDefault:
        type: geometric::LBKPIECE
        border_fraction: 0.9
        min_valid_path_fraction: 0.5

      BKPIECEkConfigDefault:
        type: geometric::BKPIECE
        border_fraction: 0.9
        failed_expansion_score_factor: 0.5
        min_valid_path_fraction: 0.5

      KPIECEkConfigDefault:
        type: geometric::KPIECE
        goal_bias: 0.05
        border_fraction: 0.9
        failed_expansion_score_factor: 0.5
        min_valid_path_fraction: 0.5

      RRTkConfigDefault:
        type: geometric::RRT
        goal_bias: 0.05

      RRTConnectkConfigDefault:
        type: geometric::RRTConnect

      RRTstarkConfigDefault:
        type: geometric::RRTstar
        goal_bias: 0.05
        delay_collision_checking: 1

      TRRTkConfigDefault:
        type: geometric::TRRT
        goal_bias: 0.05

      PRMkConfigDefault:
        type: geometric::PRM

      PRMstarkConfigDefault:
        type: geometric::PRMstar

    ur3_arm:
      planner_configs:
        - SBLkConfigDefault
        - ESTkConfigDefault
        - LBKPIECEkConfigDefault
        - BKPIECEkConfigDefault
        - KPIECEkConfigDefault
        - RRTkConfigDefault
        - RRTConnectkConfigDefault
        - RRTstarkConfigDefault
        - TRRTkConfigDefault
        - PRMkConfigDefault
        - PRMstarkConfigDefault

      longest_valid_segment_fraction: 0.01