# dobot_magician_arm isn't a real kinematic chain (the parallelogram's
# mimic joints break that), so this uses a custom analytic solver instead
# of KDL, see dobot_magician_kinematics_plugin
/**:
  ros__parameters:
    dobot_magician_arm:
      kinematics_solver: dobot_magician_kinematics_plugin/DobotMagicianKinematicsPlugin
      kinematics_solver_search_resolution: 0.005
      kinematics_solver_timeout: 0.01
