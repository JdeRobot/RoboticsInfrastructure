# IK solver config for the palletizing UR10 + suction gripper.
# Isolated from ur5_gripper_moveit_config so Pick & Place stays untouched.
# The group name MUST match the SRDF group (ur10_suction.srdf -> "ur10_arm");
# without an IK solver bound to this exact name, every Cartesian/pose goal
# (RobMove PTP/LIN, RViz marker drag) fails while joint-space moves still work.
/**:
  ros__parameters:
    ur10_arm:
      kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
      kinematics_solver_search_resolution: 0.005
      kinematics_solver_timeout: 0.05
      kinematics_solver_attempts: 15
