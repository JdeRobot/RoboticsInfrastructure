# Odometry (GZ -> ROS)
- ros_topic_name: "/amazon_robot/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Command velocity (ROS -> GZ)
- ros_topic_name: "/amazon_robot/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Platform command (ROS -> GZ)
- ros_topic_name: "/platform/cmd_vel"
  gz_topic_name: "/platform/cmd_vel"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ